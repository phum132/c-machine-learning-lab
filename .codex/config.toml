# Project-scoped custom roles. Codex loads project configuration only when the
# repository is trusted. Verify role discovery in the installed Codex runtime.

[agents]
enabled = true

[agents.architect]
description = "กำหนดสถาปัตยกรรมและสัญญาระหว่างโมดูลของ C Machine Learning Lab"
config_file = "agents/architect.toml"

[agents.c_engineer]
description = "พัฒนาโครงสร้างพื้นฐาน C11 และ utility ที่ได้รับมอบหมาย"
config_file = "agents/c_engineer.toml"

[agents.matrix_engineer]
description = "พัฒนา matrix.h/matrix.c ตามสัญญาที่ตกลง โดยเน้นมิติและ allocation safety"
config_file = "agents/matrix_engineer.toml"

[agents.ml_engineer]
description = "พัฒนา Linear/Logistic Regression และ metrics ตาม Matrix/Dataset API"
config_file = "agents/ml_engineer.toml"

[agents.data_engineer]
description = "พัฒนา CSV parser และ Dataset พร้อมระบุ syntax และข้อจำกัด"
config_file = "agents/data_engineer.toml"

[agents.testing_engineer]
description = "พัฒนา test infrastructure และกรณีปกติ ขอบเขต ผิดพลาด และ regression"
config_file = "agents/testing_engineer.toml"

[agents.security_reviewer]
description = "ตรวจ memory safety, parsing, file loading, overflow และข้อมูลไม่น่าเชื่อถือ"
config_file = "agents/security_reviewer.toml"

[agents.code_reviewer]
description = "ทบทวน implementation ที่รวมแล้วด้าน correctness, maintainability, portability และ performance"
config_file = "agents/code_reviewer.toml"

[agents.documentation_engineer]
description = "ดูแล README, architecture, ตัวอย่าง และคำอธิบายที่ยึดตาม implementation จริง"
config_file = "agents/documentation_engineer.toml"

[agents.integration_engineer]
description = "รวมงาน ตรวจความเข้ากันได้ build/test และรักษา Git changes ที่ไม่เกี่ยวข้อง"
config_file = "agents/integration_engineer.toml"
